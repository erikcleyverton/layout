   <div id="div-form">
    <h2>Cadastro de clientes </h2>
   <form >
   <label for="nome">Nome</label>
   <input type="text" name="nome" id="nome" required placeholder="Digite seu nome completo" [(ngModel)]="nome_pessoa">
    
   <label for="email">Email</label>
   <input type="text" name="email" id="email" [(ngModel)]="email_pessoa">
   
   <label for="cpf">CPF</label>
   <input type="text" name="cpf" id="cpf"  required maxlength="14" placeholder= "Digite seu CPF"  [(ngModel)]="numero_cpf">
    
   <label for="data-nascimento">Data de Nascimento</label>
   <input type="date" name="data-nascimento" id="data-nascimento"  [(ngModel)]="data_nascimento">
   
   <label for="cep">CEP</label>
   <input type="text" name="cep" id="cep" required maxlength="8" placeholder="Digite Seu CEP"   [(ngModel)]="numero_cep">
    
   <div id="div-dados-endereco">
   <label for="municipio">Municipio</label>
   <input type="text" name="municipio" id="municipio"  [(ngModel)]="sigla_municipio">
    
   <label for="UF">UF</label>
   <input type="text" name="UF" id="UF"  [(ngModel)]= "sigla_uf">
 
   </div>
    
    
   <div id="div-btns">
   <button type="button" id="btn-add" (click)= "addItem ()" >Cadastrar</button>
   <button type="button" id="btn-limpar" (click) = "LimparItem()" >Limpar</button>
   </div>
     </form>
